name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Formatting, lint, types and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run check
  node:
    name: Node integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          emscripten: "true"
      - run: pnpm run build:engine
      - run: pnpm run test
  browser:
    name: Browser integration (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [app, pad-network]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          emscripten: "true"
          chrome: "true"
      - run: pnpm exec playwright test --project ${{ matrix.project }}
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: browser-integration-failures-${{ matrix.project }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
