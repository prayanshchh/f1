name: CI toolchain
description: Install the pinned toolchain
inputs:
  emscripten:
    description: Install the Emscripten SDK that builds the Speed Dreams engine
    default: "false"
  chrome:
    description: Install Chrome for browser tests
    default: "false"
  lfs:
    description: Fetch the Git LFS art the full game needs, cached between runs
    default: "false"
runs:
  using: composite
  steps:
    - name: List Git LFS objects
      if: inputs.lfs == 'true'
      shell: bash
      run: git lfs ls-files --long | cut -d ' ' -f 1 | sort > lfs-objects.txt
    - uses: actions/cache@v6.1.0
      if: inputs.lfs == 'true'
      with:
        path: .git/lfs/objects
        key: lfs-${{ hashFiles('lfs-objects.txt') }}
    - name: Fetch Git LFS files
      if: inputs.lfs == 'true'
      shell: bash
      run: git lfs pull
    - uses: pnpm/action-setup@v6.1.0
    - uses: actions/setup-node@v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - name: Install locked JavaScript dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - uses: mymindstorm/setup-emsdk@v16
      if: inputs.emscripten == 'true'
      with:
        version: 6.0.13
        actions-cache-folder: emsdk-cache
    - name: Install Chrome and WebKit
      if: inputs.chrome == 'true'
      shell: bash
      run: pnpm exec playwright install chrome && pnpm exec playwright install --with-deps webkit
