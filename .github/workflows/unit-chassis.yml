name: Chassis unit tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chassis:
    uses: ./.github/workflows/_unit.yml
    with:
      paths: |
        crates/chassis/**
        crates/contracts/**
        Cargo.*
        rust-toolchain.toml
        tests/p1/unit.test.ts
        tests/p1/rust/**
        tests/support/**
        package.json
        pnpm-lock.yaml
        pnpm-workspace.yaml
        .nvmrc
        tsconfig.json
        vitest.config.ts
        vitest.unit.config.ts
        .github/workflows/_unit.yml
        .github/actions/setup/**
        .github/workflows/unit-chassis.yml
        .github/scripts/unit-changes.mjs
      crate: "chassis"
      suite: "tests/p1/unit.test.ts"
