name: Livery unit tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  livery:
    uses: ./.github/workflows/_unit.yml
    with:
      paths: |
        apps/client/src/livery/**
        tests/c1/livery.test.ts
        tests/f1/support/sim.ts
        package.json
        pnpm-lock.yaml
        pnpm-workspace.yaml
        .nvmrc
        tsconfig.json
        vitest.config.ts
        vitest.unit.config.ts
        .github/workflows/_unit.yml
        .github/actions/setup/**
        .github/workflows/unit-livery.yml
        .github/scripts/unit-changes.mjs
      suite: "tests/c1/livery.test.ts"
