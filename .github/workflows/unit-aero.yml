name: Aero unit tests
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  aero:
    uses: ./.github/workflows/_unit.yml
    with:
      paths: |
        crates/aero/**
        Cargo.*
        rust-toolchain.toml
        tests/p4/**
        tests/support/**
        package.json
        pnpm-lock.yaml
        pnpm-workspace.yaml
        .nvmrc
        tsconfig.json
        vitest.config.ts
        vitest.unit.config.ts
        .github/workflows/_unit.yml
        .github/actions/setup/**
        .github/workflows/unit-aero.yml
        .github/scripts/unit-changes.mjs
      crate: "aero"
      suite: "tests/p4"
