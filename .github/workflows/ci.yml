name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Formatting, lint, types and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run check
  node:
    name: Node integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run test
  browser:
    name: Browser integration (${{ matrix.project }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: app
            os: ubuntu-latest
          - project: phone-pad
            os: ubuntu-latest
          - project: pad-network
            os: ubuntu-latest
          - project: ios-simulator
            os: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          emscripten: "true"
          chrome: "true"
      - if: matrix.project == 'ios-simulator'
        run: brew install ios-webkit-debug-proxy
      - run: pnpm exec playwright test --project ${{ matrix.project }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: browser-${{ matrix.project }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
