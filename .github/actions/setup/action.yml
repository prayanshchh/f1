name: CI toolchain
description: Install the pinned toolchain
inputs:
  emscripten:
    description: Install the Emscripten SDK that builds the Speed Dreams engine
    default: "false"
  chrome:
    description: Install Chrome for browser tests
    default: "false"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6.1.0
    - uses: actions/setup-node@v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - name: Install locked JavaScript dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - uses: mymindstorm/setup-emsdk@v16
      if: inputs.emscripten == 'true'
      with:
        version: 6.0.13
        actions-cache-folder: emsdk-cache
    - name: Install Chrome
      if: inputs.chrome == 'true'
      shell: bash
      run: pnpm exec playwright install chrome
