name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    name: Deploy to revracers.com
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Skip commits that are no longer the tip of main
        id: tip
        if: github.event_name == 'workflow_run'
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" != "$SHA" ]; then
            echo "main is at $tip, not $SHA; skipping"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - name: List large files
        if: steps.tip.outputs.stale != 'true'
        run: git lfs ls-files --long > .lfs-files
      - uses: actions/cache@v6.1.0
        if: steps.tip.outputs.stale != 'true'
        with:
          path: .git/lfs/objects
          key: lfs-${{ hashFiles('.lfs-files') }}
          restore-keys: lfs-
      - name: Fetch large files
        if: steps.tip.outputs.stale != 'true'
        run: git lfs pull
      - uses: ./.github/actions/setup
        if: steps.tip.outputs.stale != 'true'
        with:
          emscripten: "true"
      - run: pnpm run deploy
        if: steps.tip.outputs.stale != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 54815173eb0477c6265204d42d705c43
