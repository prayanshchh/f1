name: Integration tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Native and WebAssembly integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          wasm-bindings: "true"
      - run: pnpm run test:integration
  browser:
    name: Browser integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          wasm-bindings: "true"
          chrome: "true"
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: browser-integration-failures
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
