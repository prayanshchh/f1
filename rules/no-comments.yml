---
id: no-rust-suppressions
language: Rust
severity: error
message: Rust ignore, allow and expect attributes are forbidden like comments
rule:
  any:
    - kind: attribute_item
    - kind: inner_attribute_item
  regex: '#\s*!?\s*\[\s*(ignore|allow|expect)\b'
