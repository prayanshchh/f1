[workspace]
members = ["crates/contracts", "crates/physics", "crates/physics-wasm", "crates/replay", "crates/chassis", "crates/chassis-replay"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.lints.rust]
dead_code = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
too_many_lines = "deny"
