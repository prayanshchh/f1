name: Scenario unit tests
on:
  pull_request:
    paths: &paths
      - "crates/contracts/**"
      - "crates/physics/**"
      - "crates/scenario/**"
      - "Cargo.*"
      - "rust-toolchain.toml"
      - ".github/workflows/_unit.yml"
      - ".github/actions/setup/**"
      - ".github/workflows/unit-scenario.yml"
  push:
    branches: [master]
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scenario:
    uses: ./.github/workflows/_unit.yml
    with:
      crate: "scenario"
