name: Contracts unit tests
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    uses: ./.github/workflows/_unit.yml
    with:
      paths: |
        crates/contracts/**
        Cargo.*
        rust-toolchain.toml
        .github/workflows/_unit.yml
        .github/actions/setup/**
        .github/workflows/unit-contracts.yml
        .github/scripts/unit-changes.mjs
      crate: "contracts"
