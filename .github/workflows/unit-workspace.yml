name: Workspace unit tests
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workspace:
    uses: ./.github/workflows/_unit.yml
    with:
      paths: |
        Cargo.*
        rust-toolchain.toml
        package.json
        pnpm-lock.yaml
        pnpm-workspace.yaml
        .nvmrc
        tsconfig.json
        vitest.config.ts
        vitest.unit.config.ts
        tests/f0/workspace.test.ts
        tools/build-wasm.mjs
        tools/contracts.mjs
        .github/workflows/_unit.yml
        .github/actions/setup/**
        .github/workflows/unit-workspace.yml
        .github/scripts/unit-changes.mjs
      suite: "tests/f0/workspace.test.ts"
      wasm-bindings: true
