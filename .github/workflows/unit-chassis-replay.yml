name: Chassis-replay unit tests
on:
  pull_request:
    paths: &paths
      - "crates/chassis/**"
      - "crates/chassis-replay/**"
      - "crates/contracts/**"
      - "Cargo.*"
      - "rust-toolchain.toml"
      - ".github/workflows/_unit.yml"
      - ".github/actions/setup/**"
      - ".github/workflows/unit-chassis-replay.yml"
  push:
    branches: [master]
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chassis-replay:
    uses: ./.github/workflows/_unit.yml
    with:
      crate: "chassis-replay"
